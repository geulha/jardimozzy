<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - O Jardim do Ozzy</title>
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>
<body>
<div class="background-gradient"></div>

<header>
    <nav>
        <ul>
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/historia}">A História de Ozzy</a></li>
            <li><a th:href="@{/perfil}">Perfil</a></li>
            <li style="margin-left: auto;"><a th:href="@{/logout}">Sair</a></li>
        </ul>
    </nav>
</header>

<section class="cadastro-section">
    <div class="cadastro-container">
        <div class="cadastro-form">
            <div class="form-header">
                <h1>Junte-se ao Jardim do Ozzy!</h1>
            </div>

            <div class="form-card">
                <form th:action="@{/cadastro}" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" placeholder="••••••••••••" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmar-senha">Confirmar senha</label>
                            <input type="password" id="confirmar-senha" name="confirmarSenha" placeholder="••••••••••••" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="pergunta">Escolha sua pergunta de segurança</label>
                            <select id="pergunta" name="pergunta" required>
                                <option value="" disabled selected>Selecione uma pergunta</option>
                                <option value="Qual é o nome do seu melhor amigo de infância?">Qual é o nome do seu melhor amigo de infância?</option>
                                <option value="Qual foi o destino da sua primeira viagem?">Qual foi o destino da sua primeira viagem?</option>
                                <option value="Qual o nome da cidade que sua mãe nasceu?">Qual o nome da cidade que sua mãe nasceu?</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="resposta">Sua resposta</label>
                            <input type="text" id="resposta" name="resposta" placeholder="Digite sua resposta" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-cadastrar">Criar Conta</button>
                </form>
            </div>
        </div>
    </div>
    <!-- Ilustrações decorativas -->
    <div class="catdog-left-illustration"></div>
    <div class="cat-right-illustration"></div>
    <div class="dog-illustration"></div>
</section>

</body>
</html>

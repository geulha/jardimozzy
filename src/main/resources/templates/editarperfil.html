<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - O Jardim do Ozzy</title>
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="background-gradient"></div>

<header>
    <nav>
        <ul>
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/historia}">A História do Ozzy</a></li>
            <li><a th:href="@{/perfil}">Perfil</a></li>
            <li style="margin-left: auto;"><a th:href="@{/memorial}">Visitar Pets</a></li>
        </ul>
    </nav>
</header>

<section class="cadastro-section">
    <div class="cadastro-container">
        <div class="cadastro-form">
            <div class="form-header">
                <h1>Editar Dados do Usuário</h1>
            </div>

            <!-- Mensagem de erro -->
            <div th:if="${erro}" style="background-color: #ff4444; color: white; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center;">
                <span th:text="${erro}"></span>
            </div>

            <!-- Mensagem de sucesso -->
            <div th:if="${sucesso}" style="background-color: #00C851; color: white; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center;">
                <span th:text="${sucesso}"></span>
            </div>

            <div class="form-card">
                <form th:action="@{/editarperfil}" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome"
                                   th:value="${usuario.nome}"
                                   placeholder="Digite seu nome" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email"
                                   th:value="${usuario.email}"
                                   placeholder="email@exemplo.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="senha">Nova Senha (deixe em branco para manter a atual)</label>
                            <input type="password" id="senha" name="senha"
                                   placeholder="••••••••••••">
                        </div>

                        <div class="form-group">
                            <label for="confirmar-senha">Confirmar Nova Senha</label>
                            <input type="password" id="confirmar-senha" name="confirmarSenha"
                                   placeholder="••••••••••••">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="pergunta">Escolha sua pergunta de segurança</label>
                            <select id="pergunta" name="pergunta" required>
                                <option value="" disabled>Selecione uma pergunta</option>
                                <option value="Qual é o nome do seu melhor amigo de infância?"
                                        th:selected="${usuario.perguntaSeguranca == 'Qual é o nome do seu melhor amigo de infância?'}">
                                    Qual é o nome do seu melhor amigo de infância?
                                </option>
                                <option value="Qual foi o destino da sua primeira viagem?"
                                        th:selected="${usuario.perguntaSeguranca == 'Qual foi o destino da sua primeira viagem?'}">
                                    Qual foi o destino da sua primeira viagem?
                                </option>
                                <option value="Qual o nome da cidade que sua mãe nasceu?"
                                        th:selected="${usuario.perguntaSeguranca == 'Qual o nome da cidade que sua mãe nasceu?'}">
                                    Qual o nome da cidade que sua mãe nasceu?
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="resposta">Sua resposta (digite novamente)</label>
                            <input type="text" id="resposta" name="resposta"
                                   placeholder="Digite sua resposta" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <div class="imagem-pessoa-cachorro"></div>
</section>

</body>
</html>
